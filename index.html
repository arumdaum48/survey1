<!-- ============================================================
     모아 설문 — 설문을 만들고 섹션(학교 › 학과)별로 관리하는 웹앱
     구성: ① 스타일(CSS)  ② 화면 뼈대(HTML)  ③ 동작(JavaScript)
     ============================================================ -->
<title>모아 설문</title>

<!-- 웹 글꼴 불러오기: 본문용 IBM Plex Sans KR, 숫자용 IBM Plex Mono -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">

<style>
  /* ────────────────────────────────────────────
     ① 스타일(CSS)
     ──────────────────────────────────────────── */

  /* [색상·글꼴 토큰] 라이트 모드 기본값. 모든 색은 여기 변수로만 지정한다 */
  :root {
    --bg: #f2f4f6;          /* 페이지 배경 */
    --surface: #ffffff;     /* 카드·입력칸 배경 */
    --surface-2: #e8ecf1;   /* 호버 배경 */
    --ink: #17212c;         /* 본문 글자 */
    --ink-2: #4c5a69;       /* 보조 글자 */
    --line: #d4dbe3;        /* 테두리 선 */
    --accent: #2c55b8;      /* 강조색(버튼, 선택 항목) */
    --accent-ink: #ffffff;  /* 강조색 위 글자 */
    --accent-soft: #e3eafa; /* 연한 강조 배경 */
    --danger: #b3261e;      /* 삭제·오류 */
    --danger-soft: #fbe7e5;
    --shadow: 0 1px 2px rgba(23,33,44,.06), 0 4px 16px rgba(23,33,44,.05);
    --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  /* [다크 모드] 시스템 설정이 다크일 때 (사용자가 라이트를 직접 고른 경우 제외) */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #11161c; --surface: #19212a; --surface-2: #222c37; --ink: #e6ebf1; --ink-2: #9aa7b5;
      --line: #2f3a46; --accent: #7fa2f0; --accent-ink: #0d1520; --accent-soft: #1f2d4a;
      --danger: #f08c83; --danger-soft: #3a1f1d; --shadow: none;
    }
  }
  /* [다크 모드] 사용자가 다크 테마를 직접 고른 경우 */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #11161c; --surface: #19212a; --surface-2: #222c37; --ink: #e6ebf1; --ink-2: #9aa7b5;
    --line: #2f3a46; --accent: #7fa2f0; --accent-ink: #0d1520; --accent-soft: #1f2d4a;
    --danger: #f08c83; --danger-soft: #3a1f1d; --shadow: none;
  }

  /* [전체 레이아웃] 왼쪽 섹션 메뉴 + 오른쪽 본문 2단. 폭 760px 이하(휴대폰)에서는 1단 */
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); padding-inline: 16px; padding-block: 0 64px; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; align-items: start; }
  @media (max-width: 760px) { .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; } }

  /* [섹션 메뉴] 스크롤해도 화면에 붙어 있는 왼쪽 메뉴 */
  .nav { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); display: grid; gap: 2px; }

  /* [섹션 메뉴 › 검색창] '섹션' 글자와 그 옆 검색 입력칸 */
  .nav-head { display: flex; align-items: center; gap: 10px; padding: 0 0 8px 10px; }
  .nav-label { font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--ink-2); flex: none; }
  .search { position: relative; flex: 1; min-width: 0; }
  .search svg { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 13px; height: 13px; color: var(--ink-2); pointer-events: none; }
  .search input { width: 100%; font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px 4px 26px; }
  .search input::placeholder { color: var(--ink-2); }
  .nav-empty { font-size: 13px; color: var(--ink-2); padding: 6px 10px; }        /* 검색 결과 없음 문구 */
  .nav-item mark { background: var(--accent-soft); color: var(--accent); border-radius: 3px; padding: 0 1px; } /* 검색어와 일치한 글자 */

  /* [섹션 메뉴 › 접기/펼치기] 상위 섹션 앞의 '>' 버튼과 하위 섹션 영역 */
  .grp-row { display: grid; grid-template-columns: 24px minmax(0, 1fr); align-items: center; }
  .tog { width: 24px; height: 28px; padding: 0; display: grid; place-items: center; background: transparent; border: 0; border-radius: 6px; color: var(--ink-2); }
  .tog:hover { background: var(--surface-2); color: var(--ink); }
  .tog svg { width: 12px; height: 12px; transition: transform .25s ease; }
  .grp.open .tog svg { transform: rotate(90deg); }   /* 펼치면 '>'가 90도 돌아 '∨'가 됨 */
  /* 하위 섹션 높이를 0 → 원래 높이로 부드럽게 늘리는 애니메이션 (grid 행 높이 전환 기법) */
  .kids { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s ease; }
  .grp.open .kids { grid-template-rows: 1fr; }
  .kids-inner { min-height: 0; overflow: hidden; display: grid; gap: 2px; opacity: 0; transition: opacity .22s ease; }
  .grp.open .kids-inner { opacity: 1; }
  /* 동작 줄이기 설정을 켠 사용자에게는 애니메이션 없이 바로 표시 */
  @media (prefers-reduced-motion: reduce) { .kids, .kids-inner, .tog svg { transition: none; } }

  /* [섹션 메뉴 › 항목] 섹션 이름 + 설문 개수 버튼 */
  .nav-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; background: transparent; color: var(--ink); border: 0; border-radius: 8px; padding: 8px 10px; }
  .nav-item:hover { background: var(--surface-2); }
  .nav-item[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; } /* 현재 선택된 섹션 */
  .nav-item .n { font-family: var(--mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .nav-item.parent { font-weight: 600; }             /* 상위 섹션(학교) */
  .nav-item.child { padding-left: 34px; }            /* 하위 섹션(학과) 들여쓰기 */
  .nav-item .nm { display: inline-flex; align-items: center; }
  /* 하위 섹션 앞의 작은 점(•). 글자 높이 가운데에 오도록 flex로 정렬 */
  .nav-item.child .nm::before { content: ""; flex: none; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .5; margin-right: 10px; }
  .nav-item.child[aria-current="true"] .nm::before { opacity: 1; }
  .nav-sep { height: 1px; background: var(--line); margin: 8px 10px; }  /* '전체 설문' 아래 구분선 */
  /* 휴대폰에서는 메뉴를 본문 위쪽 상자로 표시 */
  @media (max-width: 760px) {
    .nav { position: static; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  }

  /* [목록 머리말] 경로(세명대 › 경영학과), 섹션 제목, 설문 카드 위 소속 태그 */
  .crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
  .crumb b { color: var(--ink); font-weight: 600; }
  .sec-title { margin: 0 0 16px; font-size: 20px; font-weight: 700; text-wrap: balance; }
  .tag { display: inline-block; font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 7px; margin-right: 6px; vertical-align: 2px; font-weight: 500; }

  /* [상단 헤더] 앱 이름과 '새 설문 등록' 버튼 */
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 28px 20px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .brand span { color: var(--ink-2); font-size: 13px; }

  /* [버튼 공통] 기본·주요·보조·삭제·아이콘 버튼 */
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid transparent; padding: 8px 14px; transition: background .15s, border-color .15s; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; } /* 키보드 이동 시 테두리 */
  .btn-primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-danger { background: transparent; color: var(--danger); border-color: var(--line); }
  .btn-danger:hover { background: var(--danger-soft); }
  .btn-icon { padding: 6px 9px; background: transparent; color: var(--ink-2); border-color: transparent; line-height: 1; }
  .btn-icon:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
  .btn-icon:disabled { opacity: .3; cursor: default; }
  .notice { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; } /* 저장소 연결 안내 */

  /* [설문 목록 화면] 설문 카드 목록과 빈 상태 */
  .list-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; color: var(--ink-2); font-size: 13px; }
  .count { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .surveys { display: grid; gap: 10px; }
  .survey-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; cursor: pointer; text-align: left; width: 100%; color: inherit; }
  .survey-row:hover { border-color: var(--accent); }
  .survey-row h3 { margin: 0; font-size: 16px; font-weight: 600; text-wrap: balance; }
  .survey-row p { margin: 0; grid-column: 1; color: var(--ink-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .survey-row .meta { grid-row: 1 / span 2; grid-column: 2; text-align: right; font-size: 12px; color: var(--ink-2); display: grid; gap: 2px; } /* 오른쪽 문항 수·등록일 */
  .survey-row .meta b { font-family: var(--mono); font-size: 13px; color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  .empty { text-align: center; padding: 48px 16px; color: var(--ink-2); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; }

  /* [설문 작성 화면] 제목 카드, 질문 카드, 옵션 입력 */
  .editor { display: grid; gap: 14px; }
  .sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; box-shadow: var(--shadow); }
  .title-sheet { border-top: 4px solid var(--accent); }   /* 맨 위 제목 카드 */
  label.lbl { display: block; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--ink-2); margin-bottom: 6px; }
  input[type="text"], textarea, select { width: 100%; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
  textarea { resize: vertical; min-height: 64px; }
  .title-input { font-size: 20px; font-weight: 600; }
  .field + .field { margin-top: 14px; }
  /* 질문 카드 머리: Q번호 + 이동·복제·삭제 버튼 */
  .q-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .q-num { font-family: var(--mono); font-size: 13px; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 6px; }
  .q-tools { display: flex; gap: 2px; }
  /* 질문 입력칸 + 유형 선택칸. 좁은 화면에서는 위아래로 */
  .q-row { display: grid; grid-template-columns: 1fr 160px; gap: 10px; }
  @media (max-width: 520px) { .q-row { grid-template-columns: 1fr; } }
  /* 객관식(동그라미)·체크박스(네모) 옵션 목록 */
  .options { display: grid; gap: 8px; margin-top: 12px; }
  .opt { display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: center; }
  .opt-mark { width: 16px; height: 16px; border: 1.5px solid var(--ink-2); }
  .opt-mark.radio { border-radius: 50%; }
  .opt-mark.check { border-radius: 3px; }
  .add-opt { justify-self: start; background: transparent; color: var(--accent); padding: 4px 0; border: 0; font-size: 14px; }
  .preview-line { margin-top: 12px; border-bottom: 1px dashed var(--line); color: var(--ink-2); font-size: 13px; padding-bottom: 6px; } /* 단답형·장문형 미리보기 줄 */
  .q-foot { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .add-q { width: 100%; padding: 14px; background: transparent; border: 1.5px dashed var(--line); color: var(--accent); font-weight: 600; border-radius: 10px; }
  .add-q:hover { border-color: var(--accent); background: var(--accent-soft); }
  /* 화면 아래에 붙어 있는 저장·취소·삭제 버튼 줄 */
  .actions { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; position: sticky; bottom: 0; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); }
  .actions .right { display: flex; gap: 8px; margin-left: auto; }
  .err { color: var(--danger); font-size: 13px; }                        /* 입력 오류 문구 */
  .confirm { display: flex; gap: 8px; align-items: center; font-size: 13px; flex-wrap: wrap; } /* 삭제 확인 */

  /* [알림 토스트] '설문을 등록했어요' 같은 짧은 알림 */
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 14px; }
  /* 카드가 나타날 때 살짝 올라오는 효과 */
  @media (prefers-reduced-motion: no-preference) { .sheet { animation: rise .2s ease-out; } @keyframes rise { from { transform: translateY(4px); } to { transform: none; } } }
</style>

<!-- ────────────────────────────────────────────
     ② 화면 뼈대(HTML)
     내용은 대부분 아래 JavaScript가 채워 넣는다
     ──────────────────────────────────────────── -->
<div class="wrap">
  <!-- 상단 헤더: 앱 이름 + 새 설문 등록 버튼 -->
  <header class="top">
    <div class="brand"><h1>모아 설문</h1><span>설문을 만들고 관리하세요</span></div>
    <button class="btn-primary" id="newBtn" type="button">＋ 새 설문 등록</button>
  </header>
  <!-- 저장소 연결 실패 등 안내 문구 (평소엔 숨김) -->
  <div id="notice" class="notice" hidden></div>
  <div class="layout">
    <!-- 왼쪽 섹션 메뉴 -->
    <nav class="nav" id="nav" aria-label="섹션">
      <div id="navTop"></div>  <!-- '전체 설문' 항목 -->
      <div class="nav-sep"></div>
      <!-- '섹션' 글자 + 검색창 -->
      <div class="nav-head">
        <span class="nav-label">섹션</span>
        <label class="search">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="7" cy="7" r="5"></circle><path d="M11 11l3.5 3.5" stroke-linecap="round"></path></svg>
          <input type="search" id="secSearch" placeholder="섹션 검색" aria-label="섹션 검색" autocomplete="off">
        </label>
      </div>
      <div id="navTree" style="display:grid;gap:2px"></div>  <!-- 학교 › 학과 트리 -->
    </nav>
    <!-- 오른쪽 본문: 설문 목록 화면 또는 설문 작성 화면 -->
    <main id="app"></main>
  </div>
</div>
<!-- 짧은 알림 -->
<div id="toast" class="toast" hidden></div>

<script>
/* ────────────────────────────────────────────
   ③ 동작(JavaScript)
   ──────────────────────────────────────────── */
(function () {
  // ===== [기본 설정] 질문 유형 이름과 자주 쓰는 화면 요소 =====
  const TYPES = { short: "단답형", long: "장문형", radio: "객관식", check: "체크박스" };
  const app = document.getElementById("app");
  const newBtn = document.getElementById("newBtn");
  const notice = document.getElementById("notice");
  const nav = document.getElementById("nav");
  const navTop = document.getElementById("navTop");
  const navTree = document.getElementById("navTree");
  const secSearch = document.getElementById("secSearch");

  // ===== [앱 상태] 화면에 그릴 데이터를 모두 여기서 관리 =====
  const expanded = new Set();   // 펼쳐 둔 상위 섹션 id 모음
  let secQuery = "";            // 섹션 검색어
  let db = null;                // 저장소 연결 (연결 실패 시 null)
  let surveys = [];             // 전체 설문 목록
  let sections = [];            // 전체 섹션 목록 {id, name, parentId, order}
  let selected = "all";         // 선택한 섹션: "all"(전체), "none"(미분류), 또는 섹션 id
  let view = { mode: "list" };  // 현재 화면: list(목록) / edit(작성·수정)
  let draft = null;             // 작성 중인 설문 (저장 전 임시 데이터)
  let loaded = false;           // 설문 목록을 한 번이라도 불러왔는지

  // ===== [섹션 도우미] 섹션 트리를 찾고 따라가는 함수들 =====
  const byOrder = (a, b) => (a.order || 0) - (b.order || 0) || String(a.name).localeCompare(String(b.name), "ko"); // 순서값, 같으면 가나다순
  const secById = id => sections.find(s => s.id === id);
  const childrenOf = id => sections.filter(s => (s.parentId || null) === id).sort(byOrder); // 바로 아래 하위 섹션들 (null이면 최상위)
  const descendantIds = id => [id, ...childrenOf(id).flatMap(c => descendantIds(c.id))];      // 자신 + 모든 하위 섹션 id
  const secPath = id => { const out = []; let s = secById(id); while (s) { out.unshift(s); s = secById(s.parentId); } return out; }; // 최상위부터의 경로 [세명대, 경영학과]
  // 선택한 섹션에 들어갈 설문 고르기 (상위 섹션은 하위 섹션 설문까지 포함)
  const surveysIn = id => {
    if (id === "all") return surveys;
    if (id === "none") return surveys.filter(s => !s.sectionId || !secById(s.sectionId));
    const ids = descendantIds(id);
    return surveys.filter(s => ids.includes(s.sectionId));
  };

  // ===== [공통 도우미] =====
  const uid = () => Math.random().toString(36).slice(2, 10);   // 새 id 만들기
  const newQuestion = () => ({ id: uid(), text: "", type: "radio", options: ["", ""], required: false }); // 빈 질문 (기본: 객관식, 옵션 2개)
  // 사용자가 입력한 글자를 HTML로 안전하게 바꾸기 (<script> 등이 실행되지 않도록)
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtDate = ms => { const d = new Date(ms); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`; }; // 2026.09.27 형식

  // 화면 아래에 2초 동안 짧은 알림 띄우기
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2000);
  }

  // ===== [화면 그리기] 상태가 바뀔 때마다 호출해 화면 전체를 다시 그림 =====
  function render() {
    newBtn.hidden = view.mode !== "list";  // 작성 중에는 '새 설문 등록' 버튼 숨김
    renderNav();
    if (view.mode === "list") renderList(); else renderEditor();
  }

  // ===== [섹션 메뉴 그리기] 전체 설문 / 학교 › 학과 트리 / 미분류 + 검색 필터 =====
  function renderNav() {
    const q = secQuery.trim().toLowerCase();
    // 검색어와 일치하는 글자를 <mark>로 감싸 강조
    const mark = name => {
      const s = String(name); const i = q ? s.toLowerCase().indexOf(q) : -1;
      return i < 0 ? esc(s) : esc(s.slice(0, i)) + "<mark>" + esc(s.slice(i, i + q.length)) + "</mark>" + esc(s.slice(i + q.length));
    };
    const hit = s => String(s.name).toLowerCase().includes(q);  // 섹션 이름이 검색어를 포함하는지
    // 메뉴 항목 하나 (이름 + 설문 개수)
    const item = (id, name, cls) => `
      <button type="button" class="nav-item ${cls}" data-sec="${esc(id)}" aria-current="${selected === id}">
        <span class="nm">${mark(name)}</span><span class="n">${surveysIn(id).length}</span>
      </button>`;
    const chevron = `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5"></path></svg>`; // '>' 아이콘
    // 상위 섹션(학교)마다 그룹 하나: '>' 버튼 + 학교 이름 + 접히는 하위 섹션 영역
    const groups = childrenOf(null).map(p => {
      const kids = childrenOf(p.id);
      const kidHits = q ? kids.filter(hit) : kids;
      if (q && !hit(p) && !kidHits.length) return "";           // 검색: 학교도 학과도 안 맞으면 숨김
      const shown = q && !hit(p) ? kidHits : kids;              // 검색: 학교 이름이 안 맞으면 맞는 학과만 표시
      const open = expanded.has(p.id) || (q && kidHits.length > 0); // 학과가 검색되면 자동으로 펼침
      return `
        <div class="grp${open ? " open" : ""}" data-grp="${esc(p.id)}">
          <div class="grp-row">
            ${kids.length ? `<button type="button" class="tog" data-tog="${esc(p.id)}" aria-expanded="${open}" aria-label="${esc(p.name)} 하위 섹션 ${open ? "접기" : "펼치기"}">${chevron}</button>` : `<span></span>`}
            ${item(p.id, p.name, "parent")}
          </div>
          ${kids.length ? `<div class="kids"><div class="kids-inner"${open ? "" : " inert"}>${shown.map(c => item(c.id, c.name, "child")).join("")}</div></div>` : ""}
        </div>`;
    }).join("");
    const unfiled = surveysIn("none").length;
    navTop.innerHTML = item("all", "전체 설문", "");
    // 검색 결과가 없으면 안내 문구, 미분류 설문이 있으면 맨 아래 '미분류' 항목
    navTree.innerHTML = (groups.trim() ? groups : `<div class="nav-empty">"${esc(secQuery.trim())}"와 일치하는 섹션이 없어요.</div>`)
      + (unfiled && !q ? item("none", "미분류", "") : "");
  }

  // ===== [접기/펼치기] 메뉴를 다시 그리지 않고 class만 바꿔서 애니메이션이 보이게 함 =====
  function toggleGroup(id) {
    const grp = navTree.querySelector(`[data-grp="${CSS.escape(id)}"]`);
    if (!grp) return;
    const open = !grp.classList.contains("open");
    if (open) expanded.add(id); else expanded.delete(id);
    grp.classList.toggle("open", open);
    const tog = grp.querySelector(".tog");
    const name = secById(id) ? secById(id).name : "";
    tog.setAttribute("aria-expanded", open);
    tog.setAttribute("aria-label", `${name} 하위 섹션 ${open ? "접기" : "펼치기"}`);
    grp.querySelector(".kids-inner").inert = !open;  // 접힌 항목은 Tab 키로 이동되지 않게
  }

  // ===== [소속 섹션 선택칸] 작성 화면의 드롭다운 옵션 (하위 섹션은 '·'로 들여쓰기) =====
  function sectionOptions(current) {
    const opts = [`<option value="">미분류</option>`];
    const walk = (parentId, depth) => childrenOf(parentId).forEach(s => {
      opts.push(`<option value="${esc(s.id)}" ${s.id === current ? "selected" : ""}>${"   ".repeat(depth)}${depth ? "· " : ""}${esc(s.name)}</option>`);
      walk(s.id, depth + 1);
    });
    walk(null, 0);
    return opts.join("");
  }

  // ===== [설문 목록 화면] 선택한 섹션의 설문을 최신순 카드로 표시 =====
  function renderList() {
    if (!loaded) { app.innerHTML = `<div class="empty">설문 목록을 불러오는 중…</div>`; return; }
    if (selected !== "all" && selected !== "none" && !secById(selected)) selected = "all"; // 선택한 섹션이 사라졌으면 전체로
    const sorted = [...surveysIn(selected)].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    const path = secPath(selected);
    const heading = selected === "all" ? "전체 설문" : selected === "none" ? "미분류 설문" : path[path.length - 1].name;
    const subs = selected !== "all" && selected !== "none" ? childrenOf(selected) : [];
    const showTag = selected === "all" || subs.length > 0;  // 여러 섹션이 섞여 보일 때만 소속 태그 표시
    app.innerHTML = `
      ${path.length > 1 ? `<div class="crumb">${path.map((s, i) => i < path.length - 1 ? `<span>${esc(s.name)}</span><span aria-hidden="true">›</span>` : `<b>${esc(s.name)}</b>`).join("")}</div>` : ""}
      <h2 class="sec-title">${esc(heading)}</h2>
      <div class="list-head"><span>${subs.length ? `하위 섹션 ${subs.map(s => esc(s.name)).join(", ")} 포함` : "등록된 설문"}</span><span class="count">${sorted.length}개</span></div>
      ${sorted.length ? `<div class="surveys">${sorted.map(s => {
        const sp = secPath(s.sectionId).map(x => x.name).join(" › ");
        return `
        <button class="survey-row" type="button" data-open="${esc(s.id)}">
          <h3>${showTag && sp ? `<span class="tag">${esc(sp)}</span>` : ""}${esc(s.title || "제목 없는 설문")}</h3>
          <div class="meta"><b>${(s.questions || []).length}문항</b><span>${fmtDate(s.createdAt || Date.now())}</span></div>
          <p>${esc(s.description || (s.questions || []).map(q => q.text).filter(Boolean).join(" · ") || "질문 없음")}</p>
        </button>`; }).join("")}</div>`
      : `<div class="empty">${selected === "all" ? "아직 등록된 설문이 없어요." : `<b>${esc(heading)}</b>에 등록된 설문이 없어요.`}<br>오른쪽 위 <b>새 설문 등록</b>을 눌러 첫 설문을 만들어 보세요.</div>`}`;
  }

  // ===== [설문 작성 화면] 제목·소속·설명 카드 + 질문 카드들 + 저장 버튼 줄 =====
  function renderEditor() {
    const d = draft;
    app.innerHTML = `
      <form class="editor" id="editorForm" novalidate>
        <section class="sheet title-sheet">
          <div class="field">
            <label class="lbl" for="sv-title">설문 제목</label>
            <input type="text" id="sv-title" class="title-input" placeholder="예: 사내 식당 만족도 조사" value="${esc(d.title)}">
          </div>
          <div class="field">
            <label class="lbl" for="sv-section">소속 섹션</label>
            <select id="sv-section">${sectionOptions(d.sectionId)}</select>
          </div>
          <div class="field">
            <label class="lbl" for="sv-desc">설명 (선택)</label>
            <textarea id="sv-desc" placeholder="응답자에게 보여줄 안내 문구">${esc(d.description)}</textarea>
          </div>
        </section>
        ${d.questions.map((q, i) => questionHTML(q, i, d.questions.length)).join("")}
        <button type="button" class="add-q" data-act="add-q">＋ 질문 추가</button>
        <div class="actions">
          ${view.id ? (view.confirmDelete
            ? `<div class="confirm"><span>이 설문을 삭제할까요?</span><button type="button" class="btn-danger" data-act="del-yes">삭제</button><button type="button" class="btn-ghost" data-act="del-no">취소</button></div>`
            : `<button type="button" class="btn-danger" data-act="del">설문 삭제</button>`) : ""}
          <span class="err" id="err" hidden></span>
          <div class="right">
            <button type="button" class="btn-ghost" data-act="cancel">취소</button>
            <button type="submit" class="btn-primary">${view.id ? "변경 저장" : "설문 등록"}</button>
          </div>
        </div>
      </form>`;
  }

  // ===== [질문 카드 하나] Q번호·도구 버튼, 질문·유형 입력, 옵션 목록, 필수 응답 =====
  function questionHTML(q, i, n) {
    const choice = q.type === "radio" || q.type === "check";  // 옵션이 필요한 유형인지
    return `
      <section class="sheet" data-q="${i}">
        <div class="q-head">
          <span class="q-num">Q${i + 1}</span>
          <div class="q-tools">
            <button type="button" class="btn-icon" data-act="up" title="위로 이동" aria-label="위로 이동" ${i === 0 ? "disabled" : ""}>↑</button>
            <button type="button" class="btn-icon" data-act="down" title="아래로 이동" aria-label="아래로 이동" ${i === n - 1 ? "disabled" : ""}>↓</button>
            <button type="button" class="btn-icon" data-act="dup" title="복제" aria-label="질문 복제">⧉</button>
            <button type="button" class="btn-icon" data-act="rm-q" title="삭제" aria-label="질문 삭제">✕</button>
          </div>
        </div>
        <div class="q-row">
          <input type="text" id="q-${q.id}-text" data-f="text" placeholder="질문을 입력하세요" value="${esc(q.text)}" aria-label="질문 ${i + 1}">
          <select id="q-${q.id}-type" data-f="type" aria-label="질문 유형">
            ${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${k === q.type ? "selected" : ""}>${v}</option>`).join("")}
          </select>
        </div>
        ${choice ? `<div class="options">
          ${q.options.map((o, j) => `
            <div class="opt">
              <span class="opt-mark ${q.type === "radio" ? "radio" : "check"}"></span>
              <input type="text" id="q-${q.id}-o${j}" data-opt="${j}" placeholder="옵션 ${j + 1}" value="${esc(o)}" aria-label="옵션 ${j + 1}">
              <button type="button" class="btn-icon" data-act="rm-opt" data-j="${j}" aria-label="옵션 삭제" ${q.options.length <= 1 ? "disabled" : ""}>✕</button>
            </div>`).join("")}
          <button type="button" class="add-opt" data-act="add-opt">＋ 옵션 추가</button>
        </div>` : `<div class="preview-line">${q.type === "short" ? "단답형 텍스트" : "장문형 텍스트"}</div>`}
        <div class="q-foot">
          <label class="switch"><input type="checkbox" id="q-${q.id}-req" data-f="required" ${q.required ? "checked" : ""}> 필수 응답</label>
        </div>
      </section>`;
  }

  // ===== [작성 화면 열기] id가 있으면 기존 설문 수정, 없으면 새 설문 =====
  function openEditor(id) {
    if (id) {
      const s = surveys.find(x => x.id === id);
      if (!s) return;
      // 원본을 건드리지 않도록 복사본을 만들어 편집
      draft = JSON.parse(JSON.stringify({ title: s.title || "", sectionId: s.sectionId || "", description: s.description || "", questions: s.questions || [] }));
      draft.questions.forEach(q => { q.id = q.id || uid(); q.options = q.options || []; });
      if (!draft.questions.length) draft.questions.push(newQuestion());
    } else {
      // 새 설문: 지금 보고 있는 섹션을 소속으로 미리 선택
      draft = { title: "", sectionId: secById(selected) ? selected : "", description: "", questions: [newQuestion()] };
    }
    view = { mode: "edit", id: id || null };
    render();
    window.scrollTo({ top: 0 });
    if (!id) document.getElementById("sv-title").focus();
  }

  // 저장 버튼 줄에 오류 문구 표시
  function showErr(msg) { const e = document.getElementById("err"); e.textContent = msg; e.hidden = false; }

  // ===== [설문 저장] 입력 확인 → 빈 질문·옵션 정리 → 저장소에 기록 =====
  async function save() {
    const title = draft.title.trim();
    if (!title) { showErr("설문 제목을 입력하세요."); document.getElementById("sv-title").focus(); return; }
    // 앞뒤 공백 제거, 내용 없는 질문과 빈 옵션은 버림
    const questions = draft.questions
      .map(q => ({ id: q.id, text: q.text.trim(), type: q.type, required: !!q.required,
        options: (q.type === "radio" || q.type === "check") ? q.options.map(o => o.trim()).filter(Boolean) : [] }))
      .filter(q => q.text);
    if (!questions.length) { showErr("질문을 한 개 이상 입력하세요."); return; }
    const bad = questions.find(q => (q.type === "radio" || q.type === "check") && q.options.length < 1);
    if (bad) { showErr(`"${bad.text}" 질문에 옵션을 하나 이상 입력하세요.`); return; }

    const existing = view.id ? surveys.find(s => s.id === view.id) : null;
    const id = view.id || uid();
    const doc = { title, sectionId: draft.sectionId || null, description: draft.description.trim(), questions,
      createdAt: existing ? existing.createdAt : Date.now(), updatedAt: Date.now() };
    try {
      if (db) await db.collection("surveys").doc(id).set(doc);  // 저장소에 저장 (목록은 실시간 구독으로 자동 갱신)
      else { const i = surveys.findIndex(s => s.id === id); const row = { id, ...doc }; if (i >= 0) surveys[i] = row; else surveys.push(row); } // 저장소 없음: 화면 메모리에만
    } catch (e) {
      showErr(e && e.code === "quota_exceeded" ? "저장 공간이 가득 찼어요. 오래된 설문을 삭제한 뒤 다시 시도하세요."
        : e && e.code === "invalid_argument" ? "이 설문을 저장할 권한이 없어요. 소유자에게 편집 권한을 요청하세요."
        : "저장하지 못했어요. 잠시 후 다시 시도하세요.");
      return;
    }
    view = { mode: "list" }; draft = null; render();
    toast(existing ? "변경 내용을 저장했어요" : "설문을 등록했어요");
  }

  // ===== [설문 삭제] =====
  async function removeSurvey() {
    const id = view.id;
    try {
      if (db) await db.collection("surveys").doc(id).delete();
      else surveys = surveys.filter(s => s.id !== id);
    } catch (e) { showErr("삭제하지 못했어요. 잠시 후 다시 시도하세요."); return; }
    view = { mode: "list" }; draft = null; render(); toast("설문을 삭제했어요");
  }

  // ===== [이벤트 연결] 버튼 클릭·입력에 반응하기 =====

  // '새 설문 등록' 버튼
  newBtn.addEventListener("click", () => openEditor(null));

  // 섹션 검색창: 입력할 때마다 메뉴 필터링, Esc로 검색어 지우기
  secSearch.addEventListener("input", () => { secQuery = secSearch.value; renderNav(); });
  secSearch.addEventListener("keydown", e => { if (e.key === "Escape" && secSearch.value) { secSearch.value = ""; secQuery = ""; renderNav(); } });

  // 섹션 메뉴 클릭: '>' 버튼이면 접기/펼치기, 섹션 이름이면 그 섹션 목록 보기
  nav.addEventListener("click", e => {
    const t = e.target.closest("[data-tog]");
    if (t) { toggleGroup(t.dataset.tog); return; }
    const b = e.target.closest("[data-sec]");
    if (!b) return;
    selected = b.dataset.sec;
    const sec = secById(selected);
    if (sec && sec.parentId) expanded.add(sec.parentId);  // 학과를 고르면 소속 학교는 펼친 상태 유지
    if (view.mode !== "list") { view = { mode: "list" }; draft = null; }
    render();
  });

  // 본문 클릭: 설문 카드 열기, 작성 화면의 각종 버튼 (data-act 값으로 구분)
  app.addEventListener("click", e => {
    const open = e.target.closest("[data-open]");
    if (open) { openEditor(open.dataset.open); return; }
    const btn = e.target.closest("[data-act]");
    if (!btn || btn.disabled) return;
    const act = btn.dataset.act;
    const sec = btn.closest("[data-q]");
    const i = sec ? +sec.dataset.q : -1;  // 몇 번째 질문 카드인지
    const qs = draft && draft.questions;
    switch (act) {
      case "add-q": qs.push(newQuestion()); render(); { const last = app.querySelectorAll("[data-q]"); const inp = last[last.length - 1].querySelector('[data-f="text"]'); inp.focus(); inp.scrollIntoView({ block: "center" }); } return; // 질문 추가 후 새 입력칸으로 이동
      case "rm-q": qs.splice(i, 1); if (!qs.length) qs.push(newQuestion()); break;   // 질문 삭제 (최소 1개 유지)
      case "up": [qs[i - 1], qs[i]] = [qs[i], qs[i - 1]]; break;                    // 위로 이동
      case "down": [qs[i + 1], qs[i]] = [qs[i], qs[i + 1]]; break;                  // 아래로 이동
      case "dup": qs.splice(i + 1, 0, { ...JSON.parse(JSON.stringify(qs[i])), id: uid() }); break; // 바로 아래에 복제
      case "add-opt": qs[i].options.push(""); render(); { const opts = app.querySelectorAll(`[data-q="${i}"] [data-opt]`); opts[opts.length - 1].focus(); } return; // 옵션 추가
      case "rm-opt": qs[i].options.splice(+btn.dataset.j, 1); break;               // 옵션 삭제
      case "cancel": view = { mode: "list" }; draft = null; break;                  // 작성 취소
      case "del": view.confirmDelete = true; break;                                  // 삭제 확인 표시
      case "del-no": view.confirmDelete = false; break;
      case "del-yes": removeSurvey(); return;
      default: return;
    }
    render();
  });

  // 글자 입력: 화면을 다시 그리지 않고 draft에만 기록 (입력 중 커서가 튀지 않게)
  app.addEventListener("input", e => {
    if (!draft) return;
    const t = e.target;
    if (t.id === "sv-title") draft.title = t.value;
    else if (t.id === "sv-section") draft.sectionId = t.value;
    else if (t.id === "sv-desc") draft.description = t.value;
    else {
      const sec = t.closest("[data-q]"); if (!sec) return;
      const q = draft.questions[+sec.dataset.q];
      if (t.dataset.opt !== undefined) q.options[+t.dataset.opt] = t.value;
      else if (t.dataset.f === "text") q.text = t.value;
    }
  });

  // 질문 유형 변경(옵션 영역이 바뀌므로 다시 그림), 필수 응답 체크
  app.addEventListener("change", e => {
    if (!draft) return;
    const t = e.target; const sec = t.closest("[data-q]"); if (!sec) return;
    const q = draft.questions[+sec.dataset.q];
    if (t.dataset.f === "type") {
      q.type = t.value;
      if ((q.type === "radio" || q.type === "check") && !q.options.length) q.options = ["", ""];
      render();
    } else if (t.dataset.f === "required") q.required = t.checked;
  });

  // 폼 제출(설문 등록/변경 저장 버튼, Enter 키) → 저장
  app.addEventListener("submit", e => { e.preventDefault(); save(); });

  // 첫 화면 그리기 (데이터를 불러오기 전 '불러오는 중' 상태)
  render();

  // ===== [저장소 연결] 섹션·설문을 실시간으로 불러오고, 바뀌면 자동으로 다시 그림 =====
  (async () => {
    try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (_) { db = null; }
    if (!db) {
      // 연결 실패: 이 화면에서만 임시로 동작
      loaded = true;
      notice.textContent = "저장소에 연결할 수 없어 이 화면에서만 임시로 동작해요. 새로고침하면 작성한 설문이 사라집니다.";
      notice.hidden = false;
      if (view.mode === "list") render();
      return;
    }
    // 섹션 목록 구독
    db.collection("sections").onSnapshot(snap => {
      sections = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (view.mode === "list") render(); else renderNav();  // 작성 중이면 입력 내용 보존을 위해 메뉴만 갱신
    }, () => {});
    // 설문 목록 구독
    db.collection("surveys").onSnapshot(snap => {
      surveys = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      loaded = true;
      if (view.mode === "list") render();
    }, () => {
      loaded = true;
      notice.textContent = "설문 목록을 불러오지 못했어요. 페이지를 새로고침해 보세요.";
      notice.hidden = false;
      if (view.mode === "list") render();
    });
  })();
})();
</script>
